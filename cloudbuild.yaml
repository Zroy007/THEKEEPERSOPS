steps:
  # 1. Build the multi-stage production container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/workflow-operations-platform:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/workflow-operations-platform:latest'
      - '.'

  # 2. Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/workflow-operations-platform:$COMMIT_SHA'

  # 3. Deploy container to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'workflow-operations-platform'
      - '--image'
      - 'gcr.io/$PROJECT_ID/workflow-operations-platform:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--no-cpu-throttling'
      - '--min-instances'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/workflow-operations-platform:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/workflow-operations-platform:latest'

timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
